<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GenieStack Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0E1116; --panel:#161B23; --panel-2:#1C2330; --line:#262F3D;
  --ink:#E6ECF4; --muted:#8FA3BF; --faint:#5A6B85;
  --signal:#5CC8D7; --warn:#E0A458; --crit:#E5484D; --ok:#6FCF97;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:280px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font:400 14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
/* Scrolling stays, the scrollbars go. Firefox/IE via properties, WebKit via
   the pseudo-element. Applied to every scroller including the file and diff
   panes, which are the ones that actually overflow. */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;background:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
#app{display:flex;height:100dvh;min-height:0}
.rail{
  width:var(--rail);flex:0 0 var(--rail);background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}

/* ---------- brand ---------- */
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand .sub{margin-top:3px;font-size:12px;color:var(--faint)}
.pulse{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--signal);margin-right:7px;vertical-align:middle;
  box-shadow:0 0 0 0 rgba(92,200,215,.5);animation:beat 2.6s ease-out infinite;
}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(92,200,215,.45)}70%{box-shadow:0 0 0 7px rgba(92,200,215,0)}100%{box-shadow:0 0 0 0 rgba(92,200,215,0)}}

/* ---------- fleet ---------- */
.railhead{
  padding:12px 20px 8px;font-size:11px;color:var(--faint);
  display:flex;justify-content:space-between;align-items:baseline;
}
.fleet{flex:1;min-height:0;overflow-y:auto;padding:0 10px 16px}
.app{
  width:100%;text-align:left;padding:10px 10px;border-radius:7px;
  display:block;border:1px solid transparent;margin-bottom:1px;
}
.app:hover{background:var(--panel-2)}
.app[aria-current="true"]{background:var(--panel-2);border-color:var(--line)}
.app .n{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.app .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .m{margin-top:3px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--faint)}
.dot.live{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.crit{background:var(--crit)}
.dot.rem{background:var(--crit)}

/* ---------- top bar ---------- */
.bar{
  display:flex;align-items:center;gap:14px;padding:14px 24px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.bar h2{margin:0;font-size:15px;font-weight:600}
.bar .spacer{flex:1}
.tabs{display:flex;gap:2px}
.tab{padding:6px 12px;border-radius:6px;font-size:13px;color:var(--muted)}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--panel-2)}
.btn{
  padding:7px 13px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel);font-size:13px;color:var(--ink);
}
.btn:hover{background:var(--panel-2)}
.btn.go{background:var(--signal);color:#08252B;border-color:transparent;font-weight:600}
.btn.go:hover{filter:brightness(1.07)}
.btn.quiet{border-color:transparent;color:var(--muted);padding:5px 9px;font-size:12px}
.btn.quiet:hover{color:var(--ink);background:var(--panel-2)}

/* ---------- content ---------- */
.body{flex:1;min-height:0;overflow-y:auto;padding:22px 24px 60px}
.wrap{max-width:900px}

/* timeline: the spine of the console */
.tl{position:relative;padding-left:26px}
.tl::before{
  content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line);
}
.ev{position:relative;padding:0 0 20px}
.ev::before{
  content:"";position:absolute;left:-23px;top:7px;width:9px;height:9px;border-radius:50%;
  background:var(--panel);border:2px solid var(--faint);
}
.ev.sig::before{border-color:var(--signal)}
.ev.warn::before{border-color:var(--warn)}
.ev.crit::before{border-color:var(--crit);background:var(--crit)}
.ev .when{font-size:11px;color:var(--faint);font-family:var(--mono)}
.ev .what{margin-top:3px;font-size:14px}
.ev .meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font:500 11px/1 var(--mono);padding:4px 7px;border-radius:5px;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);
}
.chip.add{color:var(--ok);border-color:rgba(111,207,151,.3)}
.chip.chg{color:var(--signal);border-color:rgba(92,200,215,.3)}
.chip.rem{color:var(--crit);border-color:rgba(229,72,77,.3)}
.chip.live{color:var(--ok);border-color:rgba(111,207,151,.3)}
.chip.warn{color:var(--warn);border-color:rgba(224,164,88,.35)}
.paths{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.p{
  font:400 12px/1.6 var(--mono);color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
.p button{color:var(--muted);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p button:hover{color:var(--signal);text-decoration:underline}
.p .tag{flex:0 0 auto;width:9px;text-align:center;font-weight:500}
.tag.a{color:var(--ok)} .tag.c{color:var(--signal)} .tag.r{color:var(--crit)}

/* alert band inside the timeline */
.alert{
  margin-top:8px;border-left:2px solid var(--warn);background:rgba(224,164,88,.07);
  padding:9px 12px;border-radius:0 6px 6px 0;
}
.alert.crit{border-left-color:var(--crit);background:rgba(229,72,77,.08)}
.alert .t{font-size:13px;font-weight:500}
.alert .d{margin-top:3px;font-size:12px;color:var(--muted);font-family:var(--mono);word-break:break-all}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-weight:500;font-size:11px;color:var(--faint);
  padding:8px 10px;border-bottom:1px solid var(--line);
}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--panel)}
td.mono,th.mono{font-family:var(--mono);font-size:12px}

/* diff */
.dl{display:flex;font:400 12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.dl .ln{flex:0 0 46px;text-align:right;padding-right:10px;color:var(--faint);user-select:none;font-size:11px}
.dl .tx{flex:1;padding:0 12px 0 8px;border-left:2px solid transparent}
.dl.add .tx{background:rgba(111,207,151,.10);border-left-color:var(--ok)}
.dl.del .tx{background:rgba(229,72,77,.10);border-left-color:var(--crit)}
.dl.gap{color:var(--faint);background:var(--panel-2);font-size:11px;padding:3px 0}
.dl.gap .tx{border-left-color:var(--line)}
.vtabs{display:flex;gap:2px;margin-right:8px}
.vtabs button{padding:4px 10px;border-radius:5px;font-size:12px;color:var(--muted)}
.vtabs button[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}

/* file viewer */
.viewer{
  position:fixed;inset:0;background:rgba(6,9,13,.8);z-index:40;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.viewer .sheet{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  width:min(980px,100%);max-height:86dvh;display:flex;flex-direction:column;min-height:0;
}
.viewer .vh{
  padding:13px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
}
.viewer .vh .path{font:500 13px var(--mono);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer pre{
  margin:0;flex:1;min-height:0;overflow:auto;padding:16px;
  font:400 12px/1.65 var(--mono);color:var(--ink);white-space:pre;
}

/* login */
.gate{display:flex;align-items:center;justify-content:center;height:100dvh;padding:24px}
.gate .card{width:min(370px,100%)}
.gate h1{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.015em}
.gate p{margin:0 0 22px;color:var(--muted);font-size:13px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input{
  width:100%;padding:10px 12px;border-radius:7px;background:var(--panel);
  border:1px solid var(--line);
}
.field input:focus{border-color:var(--signal);outline:none}
.err{margin-top:12px;color:var(--crit);font-size:13px}

.empty{color:var(--faint);font-size:13px;padding:28px 0;max-width:52ch}
.empty b{color:var(--muted);font-weight:500;display:block;margin-bottom:4px}

/* assist: attachments */
#asktray{display:flex;flex-wrap:wrap;gap:6px}
#asktray:not(:empty){margin-bottom:8px}
.att{
  display:inline-flex;align-items:center;gap:8px;max-width:100%;
  padding:5px 6px 5px 5px;border-radius:8px;background:var(--panel);border:1px solid var(--line);
}
.att img,.att .atti{width:30px;height:30px;border-radius:5px;flex:none;object-fit:cover;background:var(--panel-2)}
.att .atti{display:flex;align-items:center;justify-content:center;font:500 9px/1 var(--mono);color:var(--muted);font-style:normal;text-transform:uppercase}
.att .attn{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.att .attn b{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.att .attn em{font-size:11px;font-style:normal;color:var(--faint)}
.att button{flex:none;width:20px;height:20px;border-radius:50%;color:var(--muted);font-size:14px;line-height:1}
.att button:hover{background:var(--panel-2);color:var(--ink)}
.att.bad{border-color:rgba(229,72,77,.45);align-items:flex-start}
.att.bad .atti{color:var(--crit)}
.att.bad .attn em{color:var(--crit);white-space:normal;max-width:60ch}
.attkeep{flex-basis:100%;font-size:11px;color:var(--faint)}
#askdrop.over textarea{border-color:var(--signal)!important}
#askclip{display:inline-flex;align-items:center;gap:6px}
.spin{color:var(--faint);font-size:13px;padding:28px 0}
.cfg{padding:12px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
.cfg input{
  width:100%;margin-top:5px;padding:6px 8px;border-radius:5px;
  background:var(--ground);border:1px solid var(--line);font:400 11px var(--mono);
}

@media (max-width:820px){
  :root{--rail:100%}
  #app{flex-direction:column}
  .rail{height:auto;max-height:38dvh;border-right:none;border-bottom:1px solid var(--line)}
  .body{padding:16px 14px 48px}
}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
const $ = (s,r=document)=>r.querySelector(s);
const root = $('#root');

// The edge worker, same host AppBuilder and AIChatPanel already call.
const WORKER = 'https://edge.hyperwax.io';

const store = {
  get base(){ return WORKER; },
  get token(){ return localStorage.getItem('gsctl.token') || ''; },
  set token(v){ v ? localStorage.setItem('gsctl.token', v) : localStorage.removeItem('gsctl.token'); },
};

const state = { fleet:[], revisions:[], alerts:[], watchdogs:[], dead:[], traffic:[], pages:[], flags:null,
                feed:[], feedRuns:[], hosts:[], findings:[], askFocus:null,
                selected:null, tab:'changes', loading:false, error:'',
                // GS_CTL_LIVE_V1. live[app_id] = [presence payloads], kept
                // current by Realtime. liveErr explains an empty panel;
                // liveOn stops a second boot opening a second connection.
                live:{}, liveErr:'', liveOn:false, platformAppId:'' };

async function api(path, opts={}){
  const r = await fetch(store.base.replace(/\/$/,'') + '/api/controller/' + path, {
    ...opts,
    headers:{ 'Authorization':'Bearer '+store.token, 'Content-Type':'application/json', ...(opts.headers||{}) }
  });
  if (r.status === 401){ store.token=''; renderGate('Session ended. Sign in again.'); throw new Error('unauthorized'); }
  const text = await r.text();
  let data; try{ data = JSON.parse(text); }catch{ data = text; }
  if (!r.ok) throw new Error((data && data.error) || ('HTTP '+r.status));
  return data;
}

const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kb = n => n==null ? '—' : n<1024 ? n+' B' : n<1048576 ? (n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB';
const ago = iso => {
  if(!iso) return 'never';
  const s = (Date.now()-new Date(iso))/1000;
  if (s<60) return 'just now';
  if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  if (s<2592000) return Math.floor(s/86400)+'d ago';
  return new Date(iso).toLocaleDateString();
};

/* ------------------------------------------------------------- live visitors */
// GS_CTL_LIVE_V1. See the header of patch_controller_html_051.py.
//
// One Realtime connection, one channel per app, read-only. The payload keys
// are the shells' own (visitor_id, page, member_email, member_name,
// deployment_id, online_at, country, countryName, region, city), so the
// platform and a tenant app render through the same code.
const GS_LIVE_MAX = 60;

async function startLive(){
  if (state.liveOn) return;
  state.liveOn = true;
  try {
    const cfg = await api('realtime-config');
    if (!cfg || !cfg.url || !cfg.anonKey) throw new Error('the worker returned no realtime config');
    state.platformAppId = cfg.platformAppId || '';

    // Dynamic, and inside the try: a console that cannot reach a CDN must
    // still open. Pinned exactly - "@2" would silently change under us.
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.45.4');
    const sb = createClient(cfg.url, cfg.anonKey, {
      auth: { persistSession: false, autoRefreshToken: false },
      realtime: { params: { eventsPerSecond: 2 } }
    });

    // The platform first - those are the clients who pay - then the fleet,
    // newest change first, which is the order the sidebar already uses.
    const ids = [];
    if (state.platformAppId) ids.push(state.platformAppId);
    state.fleet.forEach(f => { if (f.deployment_id && ids.indexOf(f.deployment_id) === -1) ids.push(f.deployment_id); });
    const use = ids.slice(0, GS_LIVE_MAX);
    if (ids.length > use.length) {
      state.liveErr = 'Showing the first ' + GS_LIVE_MAX + ' of ' + ids.length + ' apps.';
    }

    let pending = null;
    const repaint = () => {
      // Presence fires sync, join and leave separately; a tab switch of one
      // visitor is three events. Coalesced so the table is not rebuilt
      // several times for one person moving.
      if (pending) return;
      pending = setTimeout(() => { pending = null; if (state.tab === 'traffic') renderView(); }, 250);
    };

    use.forEach(id => {
      const ch = sb.channel('presence:' + id);
      const read = () => {
        try {
          const st = ch.presenceState() || {};
          const out = [];
          Object.keys(st).forEach(k => {
            const metas = st[k] || [];
            const m = metas[metas.length - 1];
            if (m) out.push(m);
          });
          state.live[id] = out;
        } catch(e) { state.live[id] = []; }
        repaint();
      };
      ch.on('presence', { event: 'sync' },  read)
        .on('presence', { event: 'join' },  read)
        .on('presence', { event: 'leave' }, read)
        // Subscribe only. track() would put the operator in his own numbers
        // and in every tenant's admin dashboard as a visitor.
        .subscribe();
    });
  } catch(e) {
    state.liveOn = false;
    state.liveErr = e && e.message || String(e);
    console.warn('[controller] live visitors unavailable:', state.liveErr);
    if (state.tab === 'traffic') renderView();
  }
}

// Everyone currently on, flattened, with the app they are on attached.
function liveRows(){
  const out = [];
  Object.keys(state.live).forEach(id => (state.live[id] || []).forEach(m => out.push({ app_id: id, ...m })));
  return out.sort((a,b) => String(b.online_at||'').localeCompare(String(a.online_at||'')));
}

/* ------------------------------------------------------- sign in / set up */
// Which screen to show depends on whether an account exists yet. Asking the
// worker first means the first person here gets "create your login" rather
// than a sign-in box for an account nobody has made.
async function renderGate(msg){
  let needsSetup = false;
  try{
    const r = await fetch(store.base.replace(/\/$/,'')+'/api/controller/setup-state');
    if (r.ok) needsSetup = !!(await r.json()).needs_setup;
  }catch(e){
    root.innerHTML = `<div class="gate"><div class="card">
      <h1>GenieStack Controller</h1>
      <p>Cannot reach ${esc(WORKER)}. The worker is not answering, so there is nothing to sign in to yet.</p>
    </div></div>`;
    return;
  }
  const setup = needsSetup;
  root.innerHTML = `
  <div class="gate"><div class="card">
    <h1>${setup ? 'Create your controller login' : 'GenieStack Controller'}</h1>
    <p>${setup
      ? 'No controller account exists yet. The first one created owns the platform, so make it now.'
      : 'Sign in to watch every app on the platform.'}</p>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
    <div class="field"><label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="${setup?'new-password':'current-password'}"></div>
    ${setup ? `<div class="field"><label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password"></div>` : ''}
    <button class="btn go" id="in" style="width:100%;margin-top:10px;padding:10px">${setup?'Create login':'Sign in'}</button>
    <div class="err" id="er">${esc(msg||'')}</div>
  </div></div>`;

  const go = async () => {
    const er = $('#er'); er.textContent='';
    const email = $('#em').value, password = $('#pw').value;
    if (setup){
      if (password.length < 10){ er.textContent = 'Use a password of at least 10 characters.'; return; }
      if (password !== $('#pw2').value){ er.textContent = 'The two passwords do not match.'; return; }
    }
    try{
      const r = await fetch(store.base.replace(/\/$/,'')+'/api/controller/'+(setup?'setup':'login'),{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, password })
      });
      const d = await r.json().catch(()=>({}));
      if (!r.ok || !d.token){ er.textContent = d.error || (setup?'Could not create the account.':'Sign in failed.'); return; }
      store.token = d.token; boot();
    }catch(e){ er.textContent = 'Cannot reach ' + WORKER + '.'; }
  };
  $('#in').onclick = go;
  const enter = e => { if(e.key==='Enter') go(); };
  $('#pw').onkeydown = enter;
  if (setup) $('#pw2').onkeydown = enter;
  $('#em').focus();
}

/* ---------------------------------------------------------------- console */
function severityOf(app){
  if (!app.last_change) return '';
  if (app.open_alerts > 0) return 'warn';
  return 'live';
}

function renderShell(){
  const sel = state.selected;
  const app = state.fleet.find(f=>f.deployment_id===sel);
  root.innerHTML = `
  <div id="app">
    <aside class="rail">
      <div class="brand">
        <h1><span class="pulse"></span>Controller</h1>
        <div class="sub">${state.fleet.length} apps watched</div>
      </div>
      <div class="railhead"><span>Fleet</span><span>${state.alerts.filter(a=>!a.acknowledged).length} open</span></div>
      <div style="padding:0 10px 6px">
        <button class="app" id="allbtn" aria-current="${!sel}">
          <div class="n"><i class="dot ${state.alerts.some(a=>!a.acknowledged)?'warn':'live'}"></i><span>All activity</span></div>
          <div class="m">every app, newest first</div>
        </button>
      </div>
      <div class="fleet" id="fleet"></div>
      <div class="cfg">
        <button class="btn quiet" id="out" style="padding-left:0">Sign out</button>
      </div>
    </aside>
    <div class="main">
      <div class="bar">
        <h2>${app ? `<button id="crumb" class="btn quiet" style="padding:0;font-size:15px;color:var(--muted)">All activity</button><span style="color:var(--faint);margin:0 6px">/</span>${esc(app.name)}` : 'All activity'}</h2>
        <div class="tabs">
          ${['changes','feed','infra','assist','traffic','flags','alerts','watchdogs','dead files'].map(t=>
            `<button class="tab" role="tab" data-tab="${t}" aria-selected="${state.tab===t}">${t}</button>`).join('')}
        </div>
        <div class="spacer"></div>
        <button class="btn" id="refresh">Refresh</button>
      </div>
      <div class="body"><div class="wrap" id="view"></div></div>
    </div>
  </div>`;

  $('#fleet').innerHTML = state.fleet.map(f=>`
    <button class="app" data-id="${esc(f.deployment_id)}" aria-current="${sel===f.deployment_id}">
      <div class="n"><i class="dot ${severityOf(f)}"></i><span>${esc(f.name||'Untitled')}</span></div>
      <div class="m">${f.file_count??0} files · ${ago(f.last_change)}</div>
    </button>`).join('') || `<div class="empty" style="padding:16px 10px">No deployments returned.</div>`;

  $('#fleet').onclick = e => {
    const b = e.target.closest('.app'); if(!b || !b.dataset.id) return;
    if (state.selected === b.dataset.id) return;   // already there, don't reload
    state.selected = b.dataset.id;
    loadRevisions();
  };
  $('#allbtn').onclick = () => { if (state.selected === null) return; state.selected = null; loadRevisions(); };
  root.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ state.tab=t.dataset.tab; renderView(); syncTabs(); });
  const crumb = $('#crumb'); if (crumb) crumb.onclick = () => { state.selected = null; loadRevisions(); };
  $('#refresh').onclick = () => boot(true);
  $('#out').onclick = () => { store.token=''; renderGate(''); };
  renderView();
}
// Switches to Assist with a subject attached. It only changes the view -
// nothing is sent until renderAssist runs, and nothing is ever written.
function askAbout(row, revision_id, path){
  state.askFocus = { row, revision_id: revision_id || null, path: path || null };
  state.tab = 'assist';
  renderView(); syncTabs();
}

function syncTabs(){ root.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', state.tab===t.dataset.tab)); }

function renderView(){
  const v = $('#view'); if(!v) return;
  // Leaving Assist drops the subject, so a later free-form question is not
  // silently still attached to an alert the operator has moved on from.
  if (state.tab !== 'assist') state.askFocus = null;
  if (state.loading){ v.innerHTML = `<div class="spin">Loading…</div>`; return; }
  if (state.error){ v.innerHTML = `<div class="empty"><b>Could not load</b>${esc(state.error)}</div>`; return; }
  if (state.tab==='changes')   return renderChanges(v);
  if (state.tab==='traffic')   return renderTraffic(v);
  if (state.tab==='flags')     return renderFlags(v);
  if (state.tab==='feed')      return renderFeed(v);
  if (state.tab==='infra')     return renderInfra(v);
  if (state.tab==='assist')    return renderAssist(v);
  if (state.tab==='alerts')    return renderAlerts(v);
  if (state.tab==='watchdogs') return renderWatchdogs(v);
  return renderDead(v);
}

function renderChanges(v){
  if (!state.revisions.length){
    v.innerHTML = `<div class="empty"><b>Nothing captured yet</b>Revisions appear the moment an app is saved in AppBuilder. The first save on each app records its whole tree as a baseline; every save after that records only what moved.</div>`;
    return;
  }
  const byRev = {};
  state.alerts.forEach(a => { (byRev[a.revision_id] ||= []).push(a); });
  const nameOf = id => (state.fleet.find(f=>f.deployment_id===id)||{}).name || id.slice(0,8);

  v.innerHTML = `<div class="tl">` + state.revisions.map(r=>{
    const al = byRev[r.id] || [];
    const worst = al.some(a=>a.severity==='critical') ? 'crit' : al.length ? 'warn' : 'sig';
    const a=r.paths_added||[], c=r.paths_changed||[], d=r.paths_removed||[];
    const line = a.length&&!c.length&&!d.length&&a.length>6
      ? `Baseline captured — ${a.length} files`
      : [c.length?`${c.length} changed`:0, a.length?`${a.length} added`:0, d.length?`${d.length} removed`:0]
        .filter(Boolean).join(', ') || 'No file movement';
    const rows = [...c.map(p=>['c',p]), ...a.map(p=>['a',p]), ...d.map(p=>['r',p])].slice(0,14);
    return `<div class="ev ${worst}">
      <div class="when">${new Date(r.created_at).toLocaleString()} · ${esc(nameOf(r.deployment_id))} · ${r.surface}</div>
      <div class="what">${esc(line)}</div>
      <div class="meta">
        <span class="chip">${r.file_count} files</span>
        <span class="chip">${kb(r.byte_size)}</span>
        ${r.actor ? '' : '<span class="chip">unattributed</span>'}
        ${r.label ? `<span class="chip chg">${esc(r.label)}</span>` : ''}
        <button class="btn quiet" data-star="${r.id}" title="Star this revision">${r.starred?'★':'☆'}</button>
        <button class="btn quiet" data-name="${r.id}">Name</button>
        <button class="btn quiet" data-restore="${r.id}">Restore</button>
      </div>
      ${rows.length ? `<div class="paths">${rows.map(([t,p])=>`
        <div class="p"><span class="tag ${t}">${t==='a'?'+':t==='r'?'−':'~'}</span>
        ${t==='r' ? `<span>${esc(p)}</span>`
                  : `<button data-rev="${r.id}" data-path="${esc(p)}">${esc(p)}</button>`}</div>`).join('')}
        ${(a.length+c.length+d.length)>14?`<div class="p" style="color:var(--faint)">…${a.length+c.length+d.length-14} more</div>`:''}
      </div>` : ''}
      ${al.map(x=>`<div class="alert ${x.severity==='critical'?'crit':''}">
        <div class="t">${esc(x.label)}</div>
        <div class="d">${esc(x.detail?.sample || x.detail?.pattern || x.detail?.message || '')}</div>
      </div>`).join('')}
    </div>`;
  }).join('') + `</div>`;

  v.onclick = async e => {
    const f = e.target.closest('button[data-rev]');
    if (f) return openFile(f.dataset.rev, f.dataset.path);

    const st = e.target.closest('button[data-star]');
    if (st){
      const r = state.revisions.find(x=>String(x.id)===st.dataset.star);
      st.disabled = true;
      try{ await api('label',{method:'POST',body:JSON.stringify({id:r.id, starred:!r.starred})});
           r.starred = !r.starred; renderView(); }
      catch(err){ st.disabled=false; }
      return;
    }

    const nm = e.target.closest('button[data-name]');
    if (nm){
      const r = state.revisions.find(x=>String(x.id)===nm.dataset.name);
      const label = prompt('Name this revision', r.label || '');
      if (label === null) return;
      try{ await api('label',{method:'POST',body:JSON.stringify({id:r.id, label})});
           r.label = label || null; renderView(); }
      catch(err){ alert('Could not save the name: ' + err.message); }
      return;
    }

    const rs = e.target.closest('button[data-restore]');
    if (rs){
      const r = state.revisions.find(x=>String(x.id)===rs.dataset.restore);
      const app = state.fleet.find(f2=>f2.deployment_id===r.deployment_id);
      const when = new Date(r.created_at).toLocaleString();
      if (!confirm(
        `Restore ${app?app.name:'this app'} (${r.surface}) to revision ${r.id}?\n\n` +
        `From ${when} — ${r.file_count} files.\n\n` +
        `The current state is captured as a new revision first, so this is reversible.`
      )) return;
      rs.disabled = true; rs.textContent = 'Restoring…';
      try{
        const d = await api('restore',{method:'POST',body:JSON.stringify({revision_id:r.id})});
        alert(d.no_op
          ? 'Already identical to that revision — nothing changed.'
          : `Restored ${d.files} files. New revision ${d.result_revision}; the previous state is revision ${d.prior_revision}.`);
        boot(true);
      }catch(err){ rs.disabled=false; rs.textContent='Restore'; alert('Restore failed: ' + err.message); }
    }
  };
}

  // still have somebody in it this second - and that is the more urgent fact.
  const live = liveRows().filter(r => !sel || r.app_id === sel);

    ? 'GenieStack (platform)'

  const onFor = iso => {

          + `</tbody></table>`

             state.liveErr
               ? `<b>Live view unavailable</b>${esc(state.liveErr)}`
               : `<b>Nobody on right now</b>This updates by itself as people arrive and leave. A client in the builder shows the app they have open in the <b>In</b> column.`
           }</div>`)

  const f = state.flags;
  if (!f){ v.innerHTML = `<div class="spin">Loading flags…</div>`; return; }
  const frozen = f.state && f.state.frozen;
  const ovByFlag = {};
  (f.overrides||[]).forEach(o => { (ovByFlag[o.flag_key] ||= []).push(o); });

  v.innerHTML = `
    <div class="alert ${frozen?'crit':''}" style="border-left-color:${frozen?'var(--crit)':'var(--line)'};background:${frozen?'rgba(229,72,77,.08)':'var(--panel)'};margin:0 0 20px">
      <div class="t">${frozen ? 'Platform frozen' : 'Platform live'}</div>
      <div class="d">${frozen
        ? esc(f.state.freeze_reason||'') + ' — by ' + esc(f.state.frozen_by||'unknown') + ', ' + ago(f.state.frozen_at)
        : 'Restores and flag changes are permitted.'}</div>
      <button class="btn ${frozen?'':'quiet'}" id="freezebtn" style="margin-top:9px">${frozen?'Unfreeze':'Freeze platform'}</button>
    </div>
    <table><thead><tr><th>Flag</th><th>State</th><th>Rollout</th><th>Overrides</th><th></th></tr></thead><tbody>`
    + (f.flags||[]).map(x=>`<tr>
        <td><div class="mono">${esc(x.key)}</div>
            <div style="color:var(--faint);font-size:12px">${esc(x.description||'')}</div></td>
        <td><span class="chip ${x.state==='on'?'add':x.state==='off'?'':'chg'}">${esc(x.state)}</span></td>
        <td class="mono">${x.state==='rollout' ? x.rollout_percent+'%' : '—'}</td>
        <td class="mono">${(ovByFlag[x.key]||[]).length || '—'}</td>
        <td><button class="btn quiet" data-flag="${esc(x.key)}">Change</button></td>
      </tr>`).join('')
    + `</tbody></table>
    <button class="btn" id="newflag" style="margin-top:14px">New flag</button>`
    + ((f.log||[]).length ? `<div style="margin-top:26px">
        <div style="font-size:13px;font-weight:500;margin-bottom:8px">Change log</div>
        <table><thead><tr><th>When</th><th>Flag</th><th>Change</th><th>Reason</th><th>By</th></tr></thead><tbody>`
        + f.log.map(l=>`<tr><td>${ago(l.created_at)}</td><td class="mono">${esc(l.flag_key)}</td>
            <td class="mono">${esc(JSON.stringify(l.change).slice(0,60))}</td>
            <td>${esc(l.reason||'')}</td><td>${esc(l.actor_email||'—')}</td></tr>`).join('')
        + `</tbody></table></div>` : '');

  $('#freezebtn').onclick = async () => {
    if (frozen){
      if (!confirm('Unfreeze the platform? Restores and flag changes become possible again.')) return;
      try{ await api('freeze',{method:'POST',body:JSON.stringify({frozen:false})}); loadFlags(); }
      catch(e){ alert(e.message); }
      return;
    }
    const reason = prompt('Why are you freezing the platform? This is recorded.');
    if (!reason) return;
    try{ await api('freeze',{method:'POST',body:JSON.stringify({frozen:true, reason})}); loadFlags(); }
    catch(e){ alert(e.message); }
  };

  const editFlag = async (key, existing) => {
    const st = prompt(`State for "${key}" — off / on / rollout / override`, existing ? existing.state : 'off');
    if (!st) return;
    let pct = existing ? existing.rollout_percent : 0;
    if (st === 'rollout'){
      const p = prompt('Rollout percentage (0-100)', String(pct));
      if (p === null) return;
      pct = Number(p) || 0;
    }
    const reason = prompt('Reason for this change. Required.');
    if (!reason) return;
    try{
      await api('flag',{method:'POST',body:JSON.stringify({ key, state:st, rollout_percent:pct, reason })});
      loadFlags();
    }catch(e){ alert('Could not change the flag: ' + e.message); }
  };

  v.querySelectorAll('button[data-flag]').forEach(b => {
    b.onclick = () => editFlag(b.dataset.flag, (f.flags||[]).find(x=>x.key===b.dataset.flag));
  });
  $('#newflag').onclick = () => {
    const key = prompt('Flag key, e.g. new_checkout');
    if (!key) return;
    editFlag(key.trim(), null);
  };
}

        <td class="mono">${esc(w.pattern ?? (w.threshold_int!=null ? '> '+w.threshold_int : '—'))}</td>

        <td><button class="btn quiet" data-askai="${w.id}">Ask AI</button> <button class="btn quiet" data-tog="${w.id}" data-on="${w.enabled}">${w.enabled?'Disable':'Enable'}</button></td>
      </tr>`).join('') + `</tbody></table>`;
  v.onclick = async e => {
    const ai = e.target.closest('button[data-askai]');
    if (ai){
      const w = state.watchdogs.find(x=>String(x.id)===ai.dataset.askai);
      // A watchdog has no revision of its own. Hand it the newest alert this
      // rule raised, if there is one, so the verdict is made against a real

      const hit = state.alerts.find(a=>a.watchdog_id===w.id || a.label===w.name);

                      hit?.revision_id || null, hit?.detail?.path || null);

    }

      state.watchdogs = await api('watchdogs'); renderView();
    }catch(err){ b.disabled=false; }
  };
}


/* ------------------------------------------------------------------- feed */
// Dealerslink inventory feed. The key subtlety: dealer_feed_runs only records
// a run when the vendor's file CHANGED. The relay fetches every 30 minutes
// and skips identical files, so observed gaps run 9-15 hours and a "last run"
// of several hours is healthy, not a fault. 26h matches STALE_HOURS in
// feed-alert.sh, which is the deadman already watching this on the box.
const FEED_STALE_S = 26 * 3600;
// Since 045 the relay reports EVERY run, not only the ones that import. It
// runs every 30 minutes, so three missed in a row is not jitter. Must match
// GS_FEED_CHECK_FRESH_S in the Worker, or the tab and the alert disagree.
const FEED_CHECK_FRESH_S = 90 * 60;

// What the relay last told us about this feed.
//   null      it has never checked in (045 is not on the box yet), or the
//             feed is disabled. Everything then behaves as it did before.
//   'silent'  it used to check in and has stopped. Our side.
//   'same'    fetched, identical to the last file. The vendor is quiet.
//   'changed' fetched and imported.
//   'fetch_failed' / 'refused'  it reached us to say the fetch went wrong.
function feedCheck(f){
  if (!f || f.enabled === false) return null;
  if (!f.last_check_at || f.check_age_s == null) return null;
  if (Number(f.check_age_s) > FEED_CHECK_FRESH_S) return 'silent';
  const r = String(f.last_check_result || '').toLowerCase();
  return ['same','changed','fetch_failed','refused'].includes(r) ? r : null;
}

function feedTone(f){
  const st = String(f.run_status || f.last_status || '').toLowerCase();
  if (st && st !== 'ok') return 'rem';
  // typeof guard: t_feed.mjs lifts this one function out of the page and runs
  // it alone, and it must keep passing there.
  const c = (typeof feedCheck === 'function') ? feedCheck(f) : null;
  if (c === 'silent' || c === 'fetch_failed' || c === 'refused') return 'rem';
  if (f.age_s == null) return '';
  if (f.age_s <= FEED_STALE_S) return 'live';
  // Old import. If the relay fetched minutes ago and the file was identical,
  // nothing is broken - amber, not red. Anything else is still red.
  return c === 'same' ? 'warn' : 'rem';
}

function feedSpan(s){
  s = Math.max(0, Math.floor(Number(s) || 0));
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' min';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h + 'h' + (h < 6 && m ? ' ' + m + 'm' : '');
}

// The words that go with feedCheck. Plain text only - callers escape it.
//   line   goes after "last import ..." on the feed's header row
//   chip   a short label beside the name, or '' when there is nothing to flag
//   head / body   the explanation under the table, or '' for none
function feedStory(f){
  const c = feedCheck(f);
  const out = { check: c, line: '', chip: '', tone: '', head: '', body: '', cmd: '' };
  if (!c) return out;
  const who   = String(f.provider || 'the vendor');
  const since = feedSpan(f.check_age_s);
  const size  = f.last_check_bytes != null ? ' (' + Number(f.last_check_bytes).toLocaleString('en-US') + ' bytes)' : '';
  const note  = String(f.last_check_note || '').trim();
  const stale = f.age_s != null && f.age_s > FEED_STALE_S;

  if (c === 'silent'){
    out.line = 'relay last reported ' + since + ' ago';
    out.chip = 'relay not reporting'; out.tone = 'rem';
    out.head = 'The relay has not reported for ' + since;
    out.body = 'It reports every 30 minutes whether or not the file changed, so this is on our side, not ' + who + ': the timer, relay.sh itself, or the box\'s route to the edge. If the Infra tab shows the host silent, that is the cause and this is the same outage. On the Proxmox shell:';
    out.cmd  = "systemctl list-timers 'feed-*' --no-pager\ntail -20 /var/log/feed-relay.log";
  } else if (c === 'fetch_failed'){
    out.line = 'checked ' + since + ' ago: could not download' + (note ? ' (' + note + ')' : '');
    out.chip = 'fetch failing'; out.tone = 'rem';
    out.head = 'The relay cannot download the file from ' + who;
    out.body = 'It reached us to say so ' + since + ' ago, so the box and its internet are up. The problem is between the box and the vendor\'s FTP' + (note ? ' (' + note + ')' : '') + '. curl exit 6 is DNS on the box, 7 or 28 is their FTP down or slow, 67 is the login being refused. On the Proxmox shell:';
    out.cmd  = 'tail -20 /var/log/feed-relay.log';
  } else if (c === 'refused'){
    out.line = 'checked ' + since + ' ago: file refused' + (note ? ' (' + note + ')' : '');
    out.chip = 'file refused'; out.tone = 'rem';
    out.head = 'The relay downloaded a file and refused to forward it';
    out.body = (note ? note.charAt(0).toUpperCase() + note.slice(1) + '. ' : '') + 'That guard is deliberate: a truncated file would retire the whole lot. If it repeats, the export on ' + who + '\'s side is broken and there is nothing to fix on ours. On the Proxmox shell:';
    out.cmd  = 'tail -20 /var/log/feed-relay.log';
  } else if (c === 'same'){
    out.line = 'checked ' + since + ' ago: unchanged' + size;
    if (stale){
      out.chip = 'vendor quiet'; out.tone = 'warn';
      out.head = 'No new file from ' + who + ' in ' + feedSpan(f.age_s);
      out.body = 'The relay fetched it ' + since + ' ago and it was identical' + size + ', so the relay, the network and the importer are all working. Nothing is broken on our side and there is nothing to run. The lot updates with the next file they publish.';
    }
  } else if (c === 'changed'){
    out.line = 'checked ' + since + ' ago: new file imported';
  }
  return out;
}

/* ------------------------------------------------------------------ infra */
// Boxes push a beat every five minutes because they sit behind CGNAT and
// cannot be polled. SILENCE IS THE SIGNAL: a host that stops beating still
// shows its last row with a growing age, which is what a network outage
// looks like from here.
const HOST_SILENT_S = 15 * 60;


// Findings raised by the triage pass. They sit above the hosts because a
// finding is the thing you act on; the host cards are context for it.
//
// remedy_state is the honest bit: 'pending' means queued for the next beat,
// 'sent' means handed over and we are waiting to hear, 'done'/'failed' is
// what actually happened on the box. 'none' means nothing automatic applies
// and the steps are for you.
function renderFindings(v){
  if (!state.findings.length) return '';
  const tone = f => f.severity === 'critical' ? 'rem' : 'chg';
  const rstate = f => {
    if (!f.remedy) return '<span class="chip">manual fix</span>';
    const s = f.remedy_state;

    if (s === 'sent')    return `<span class="chip chg">${esc(f.remedy)} running</span>`;
    if (s === 'done')    return `<span class="chip live">${esc(f.remedy)} applied</span>`;
    if (s === 'failed')  return `<span class="chip rem">${esc(f.remedy)} failed</span>`;

  return `<div class="railhead" style="padding-left:0"><span>Open findings</span><span>${state.findings.length}</span></div>`
    + state.findings.map(f=>`
      <div style="margin-bottom:14px;border-left:2px solid var(--line,#2a2a30);padding-left:12px">

        ${f.steps ? `<pre style="white-space:pre-wrap;font-size:12px;line-height:1.5;margin:0;color:var(--muted)">${esc(f.steps)}</pre>` : ''}

}
